<script src="nav.js"></script>
<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){
    var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(var i=2;i<arguments.length;i++)add(el,arguments[i]);
  return el;
}
function add(el,c){
  if(c==null||c===false)return;
  if(Array.isArray(c))c.forEach(function(x){add(el,x)});
  else if(c.nodeType)el.appendChild(c);
  else el.appendChild(document.createTextNode(String(c)));
}
function $(s,r){return (r||document).querySelector(s)}
var store={
  get:function(k,d){try{var v=localStorage.getItem('aml.'+k);return v==null?d:v}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem('aml.'+k,v)}catch(e){}}
};
function mean(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
function median(a){if(!a.length)return 0;var s=a.slice().sort(function(x,y){return x-y}),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
function r1(n){return Math.round(n*10)/10}
function pct(n){return Math.round(n*100)+'%'}
function rint(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function nums(str,n){
  var p=str.split(',');if(p.length!==n)return null;
  var o=[];for(var i=0;i<n;i++){var v=parseFloat(p[i]);if(!isFinite(v)||v<0)return null;o.push(v)}
  return o;
}
function fmtMin(s){var m=Math.floor(s/60),x=Math.floor(s%60);return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}

function seg(options,value,onchange,label){
  var box=h('div',{class:'seg2',role:'group','aria-label':label||''});
  function paint(v){Array.prototype.forEach.call(box.children,function(b){b.setAttribute('aria-pressed',b.getAttribute('data-v')===String(v))})}
  options.forEach(function(o){
    var b=h('button',{type:'button','data-v':o[0],onclick:function(){paint(o[0]);onchange(o[0])}},o[1]);
    box.appendChild(b);
  });
  paint(value);
  box.set=paint;
  return box;
}
function stack(parts){
  var b=h('div',{class:'bar big'});
  parts.forEach(function(p){b.appendChild(h('span',{class:'seg '+p[0],style:{flexGrow:Math.max(p[1],0.0001)},title:p[2]||''},p[3]||''))});
  return b;
}
function verdict(status,title,text){
  return h('div',{class:'verdict '+status},h('b',null,title),h('span',null,text));
}
function FEW(n){return verdict('few','Not enough data yet','Needs 3 or more rows in each group. Rows so far: '+n+'.')}
function table(head,rows){
  var t=h('table',{class:'t'}),tr=h('tr');
  head.forEach(function(x){tr.appendChild(h('th',null,x))});
  t.appendChild(h('thead',null,tr));
  var tb=h('tbody');
  rows.forEach(function(r){var tr2=h('tr');r.forEach(function(c){tr2.appendChild(h('td',null,c))});tb.appendChild(tr2)});
  t.appendChild(tb);
  return h('div',{class:'tw'},t);
}
function codeBox(code,label){
  var inp=h('input',{type:'text',readonly:true,value:code,'aria-label':label||'Your result code'});
  var msg=h('span',{class:'note','aria-live':'polite'});
  var btn=h('button',{class:'btn solid',type:'button',onclick:function(){
    inp.focus();inp.select();
    var ok=false;
    try{ok=document.execCommand('copy')}catch(e){}
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code);ok=true}}catch(e){}
    msg.textContent=ok?'Copied. If it did not work, select the code and copy it.':'Select the code and copy it.';
  }},'Copy code');
  return h('div',null,h('div',{class:'codebox'},inp,btn),msg);
}
function numField(label,val,step){
  var inp=h('input',{type:'number',min:'0',step:step||'0.1',inputmode:'decimal'});
  if(val!=null)inp.value=val;
  return {el:h('label',{class:'f'},label,inp),inp:inp};
}
function statusOf(ok){return ok===true?'supports it':(ok===false?'counts against it':'unclear')}
function logLine(p,name,status,detail){
  var txt='Test '+p+' '+name+' | '+status+' | '+detail;
  return h('div',{class:'logline'},h('div',{class:'eyebrow'},'For your class log'),
    h('p',{style:{margin:'4px 0 0'}},h('b',null,'Test '+p+' '+name+': '+status+'. '),detail),
    codeBox(txt,'Line for the class log'));
}
function phaseTimer(phases,onUse){
  var acc={},cur=null,t0=0,iv=null,btns={},disp={};
  phases.forEach(function(p){acc[p[0]]=0});
  function now(){return Date.now()}
  function stopCur(){if(cur!=null){acc[cur]+=(now()-t0)/1000;cur=null}}
  function paint(){
    phases.forEach(function(p){
      var s=acc[p[0]]+(cur===p[0]?(now()-t0)/1000:0);
      disp[p[0]].textContent=fmtMin(s);
      btns[p[0]].className='ph'+(cur===p[0]?' run '+p[2]:'');
    });
  }
  function start(k){
    if(cur===k){stopCur();paint();return}
    stopCur();cur=k;t0=now();paint();
    if(!iv)iv=setInterval(paint,250);
  }
  var wrap=h('div',{class:'timer'});
  wrap.appendChild(h('div',{class:'note'},'Press a phase to start its clock. Press another to switch. Press the running one to pause.'));
  var row=h('div',{class:'phases'});
  phases.forEach(function(p){
    disp[p[0]]=h('small',null,'00:00');
    btns[p[0]]=h('button',{type:'button',class:'ph',onclick:function(){start(p[0])}},p[1],disp[p[0]]);
    row.appendChild(btns[p[0]]);
  });
  wrap.appendChild(row);
  var use=h('button',{class:'btn sm',type:'button',onclick:function(){
    stopCur();paint();
    var m={};phases.forEach(function(p){m[p[0]]=r1(acc[p[0]]/60)});
    onUse(m);
  }},'Use these minutes');
  var reset=h('button',{class:'btn sm',type:'button',onclick:function(){
    cur=null;phases.forEach(function(p){acc[p[0]]=0});paint();
  }},'Reset');
  wrap.appendChild(h('div',{style:{display:'flex',gap:'8px'}},use,reset));
  return wrap;
}

/* generic class-results panel: students' codes in, class result out */
function resultsPanel(id,cfg){
  var key='codes.'+id;
  var ta=h('textarea',{rows:6,placeholder:'Paste student codes here. One per line.',spellcheck:'false','aria-label':'Student codes'});
  ta.value=store.get(key,'');
  var out=h('div');
  var info=h('p',{class:'note','aria-live':'polite'});
  function run(){
    store.set(key,ta.value);
    var rows=[],bad=0;
    ta.value.split('\n').forEach(function(l){
      l=l.trim();if(!l)return;
      var m=l.match(/^(t\d):(.*)$/i);
      if(!m||m[1].toLowerCase()!==id){bad++;return}
      var r=cfg.parse(m[2].trim());
      if(r)rows.push(r);else bad++;
    });
    info.textContent=rows.length+(rows.length===1?' row read':' rows read')+(bad?' · '+bad+' not read':'');
    out.innerHTML='';
    out.appendChild(cfg.aggregate(rows));
  }
  ta.addEventListener('input',run);
  var el=h('div',null,
    cfg.extra||null,
    h('p',null,'Students give you a code like ',h('span',{class:'mono'},cfg.example),'. Paste one per line.'),
    ta,
    h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap',margin:'10px 0'}},
      h('button',{class:'btn sm',type:'button',onclick:function(){ta.value=cfg.sample().join('\n');run()}},'Load a sample class'),
      h('button',{class:'btn sm',type:'button',onclick:function(){ta.value='';run()}},'Clear')),
    info,out);
  el.run=run;
  setTimeout(run,0);
  return el;
}

/* ================= TEST 1: where the time goes ================= */
var T1={
  id:'t1',n:1,title:'Where the time goes',time:'30 min',split:'Split the class in two',unit:'Stages and time',
  plan:[[5,'Intro. Say the claim. Split the class.'],[12,'Students work and log minutes.'],[8,'Paste codes. Read the result.'],[5,'Debrief.']],
  claim:'AI can decrease Planning and Doing. Some of the work moves to Checking.',
  prediction:'The AI group spends a bigger share of its time checking and a smaller share doing. Completion time may go up, down, or stay the same.',
  assign:[
    'Everyone gets the same task. Group H does it by hand. Group A uses AI.',
    'Open the timer. Press Planning while you think about the audience and the hook.',
    'Press Doing while you write, or while you prompt and wait for the AI.',
    'Press Checking while you reread, compare to the facts and fix.',
    'Stop. Enter your minutes. Give your code to the teacher.'
  ],
  teacher:[
    'Split the class in two. Say who is H and who is A. Swap next week with a new task.',
    'Planning is thinking before writing or prompting. Doing is writing or prompting. Checking is rereading, comparing to the facts and fixing.',
    'Give 12 minutes. Ask students to be honest on the clock. It is their data.',
    'Ask the class after: Where did the saved minutes go?'
  ],
  build:function(){
    var g='A',root=h('div');
    var task=h('div',{class:'quote'},h('b',null,'The task. '),'Write one Instagram caption for our class bubble tea stall. The new flavor is Thai tea. It costs 30 baht. The fair is on Saturday. Keep it under 30 words.');
    var gseg=seg([['H','Group H: by hand'],['A','Group A: with AI']],g,function(v){g=v;update()},'Your group');
    var p=numField('Planning (min)'),d=numField('Doing (min)'),c=numField('Checking (min)');
    var out=h('div');

      if(round==='0'){
        var pr=[];for(var i=0;i<6;i++)pr.push(prob());
        body.appendChild(h('div',{class:'panel',style:{marginTop:'14px'}},h('span',{class:'pill'},'Step 1'),h('h3',{style:{marginTop:'10px'}},'Learn it'),explainer));
        body.appendChild(h('div',{class:'panel',style:{marginTop:'14px'}},h('span',{class:'pill'},'Step 2'),h('h3',{style:{marginTop:'10px'}},'Practice'),
          h('p',null,g==='H'?'Do these by hand. No AI.':'Use AI however you like.'),
          h('ol',{style:{paddingLeft:'20px'}},pr.map(function(p){return h('li',{style:{margin:'8px 0'}},p.text)}))));
      }else{
        body.appendChild(h('div',{class:'panel',style:{marginTop:'14px'}},h('p',null,'Later test. No practice today. Go straight to the test.')));
      }
      body.appendChild(testBlock());
    }
    function testBlock(){
      var box=h('div',{class:'panel',style:{marginTop:'14px'}},h('span',{class:'pill dark'},'Test'),h('h3',{style:{margin:'10px 0'}},'Five problems. No AI. No notes.'));
      var area=h('div'),t0=0,ps=[];
      var start=h('button',{class:'btn solid',type:'button',onclick:function(){
        ps=[];for(var i=0;i<5;i++)ps.push(prob());t0=Date.now();start.style.display='none';area.innerHTML='';
        var inputs=ps.map(function(p){var inp=h('input',{type:'number',min:'0',step:'1',inputmode:'numeric','aria-label':'Answer'});area.appendChild(h('div',{class:'card',style:{marginBottom:'10px'}},h('p',{style:{margin:'0 0 8px'}},p.text),inp));return inp});
        area.appendChild(h('button',{class:'btn solid',type:'button',onclick:function(){
          var secs=Math.round((Date.now()-t0)/1000),score=0;
          ps.forEach(function(p,i){if(parseInt(inputs[i].value,10)===p.ans)score++});
          area.innerHTML='';
          area.appendChild(h('div',{class:'stats'},h('span',null,h('b',null,score+' of 5'),'correct'),h('span',null,h('b',null,A.fmtMin(secs)),'time')));
          area.appendChild(h('div',{class:'quote'},h('b',null,'Correct answers: '),ps.map(function(p){return p.ans}).join(', ')));
          area.appendChild(h('p',null,'Give this code to your teacher.'));
          area.appendChild(codeBox('t5:'+g+','+round+','+score+','+secs));
        }},'Submit the test'));
      }},'Start the test');
      box.appendChild(start);box.appendChild(area);return box;
    }
    root.appendChild(h('div',{class:'panel'},h('p',{style:{marginTop:0}},h('b',null,'Your group')),gseg,h('p',null,h('b',null,'Which test is this?')),rseg));
    root.appendChild(body);draw();
    return root;
  },
  results:function(){
    return resultsPanel('t5',{
      example:'t5:A,0,3,240',
      parse:function(s){var p=s.split(',');if(p.length!==4)return null;var g=p[0];if(g!=='H'&&g!=='A')return null;var r=+p[1];if(r!==0&&r!==1)return null;var n=nums(p[2]+','+p[3],2);if(!n||n[0]>5)return null;return {g:g,r:r,score:n[0],secs:n[1]}},
      sample:function(){var o=[],i;for(i=0;i<9;i++)o.push('t5:H,0,'+rint(3,5)+','+rint(180,400));for(i=0;i<9;i++)o.push('t5:A,0,'+rint(1,4)+','+rint(150,380));for(i=0;i<7;i++)o.push('t5:H,1,'+rint(3,5)+','+rint(150,350));for(i=0;i<7;i++)o.push('t5:A,1,'+rint(1,4)+','+rint(150,350));return o},
      aggregate:function(rows){
        var w=h('div'),trs=[],res=[],det=[];
        [0,1].forEach(function(r){
          var H=rows.filter(function(x){return x.g==='H'&&x.r===r}),Aa=rows.filter(function(x){return x.g==='A'&&x.r===r});
          trs.push([(r?'A week later':'Today'),'H: by hand',H.length,H.length?r1(mean(H.map(function(x){return x.score})))+' of 5':'-',H.length?A.fmtMin(mean(H.map(function(x){return x.secs}))):'-']);
          trs.push([(r?'A week later':'Today'),'A: with AI',Aa.length,Aa.length?r1(mean(Aa.map(function(x){return x.score})))+' of 5':'-',Aa.length?A.fmtMin(mean(Aa.map(function(x){return x.secs}))):'-']);
        });
        w.appendChild(table(['Test','Practice group','n','Average score','Average time'],trs));
        var any=false;
        [0,1].forEach(function(r){
          var H=rows.filter(function(x){return x.g==='H'&&x.r===r}),Aa=rows.filter(function(x){return x.g==='A'&&x.r===r});
          if(H.length>=3&&Aa.length>=3){any=true;var mh=mean(H.map(function(x){return x.score})),ma=mean(Aa.map(function(x){return x.score}));
            w.appendChild(verdict(ma<mh?'held':'not',(r?'A week later: ':'Today: ')+(ma<mh?'the AI practice group scored lower':'the AI practice group did not score lower'),'By hand '+r1(mh)+' of 5. With AI '+r1(ma)+' of 5.'));
            if(r===0){res.push(ma<mh);det.push('Same-day test: '+r1(mh)+' of 5 by hand, '+r1(ma)+' with AI.')}
            else det.push('A week later: '+r1(mh)+' by hand, '+r1(ma)+' with AI.');
          }
        });
        if(!any)w.appendChild(FEW(rows.length));
        else if(res.length)w.appendChild(logLine(5,'When the work is the point',statusOf(res[0]),'n='+rows.length+'. '+det.join(' ')));
        return w;
      }
    });
  }
};

/* ================= app: router and pages ================= */
var tests=A.tests.concat([T4,T5]);
var cache={},tabs={},app=A.$('#app');
var mode={teacher:A.store.get('teacher','0')==='1',present:A.store.get('present','0')==='1'};
function applyMode(){
  document.body.classList.toggle('teacher',mode.teacher);
  document.body.classList.toggle('present',mode.present);
  A.$('#tTeacher').setAttribute('aria-pressed',mode.teacher);
  A.$('#tPresent').setAttribute('aria-pressed',mode.present);
}
A.$('#tTeacher').addEventListener('click',function(){mode.teacher=!mode.teacher;A.store.set('teacher',mode.teacher?'1':'0');applyMode();render()});
A.$('#tPresent').addEventListener('click',function(){mode.present=!mode.present;A.store.set('present',mode.present?'1':'0');applyMode()});

function navLinks(cur){
  var ul=A.$('#navlinks');ul.innerHTML='';
  ul.appendChild(h('li',null,h('a',{class:'l'+(cur==='home'?' on':''),href:'#home'},'Home')));
  tests.forEach(function(t){ul.appendChild(h('li',null,h('a',{class:'l'+(cur===t.id?' on':''),href:'#'+t.id,title:t.title,'aria-label':'Test '+t.n+': '+t.title},String(t.n))))});
}
function metaPills(t){return [h('span',{class:'pill'},t.time),h('span',{class:'pill'},t.split),h('span',{class:'pill dark'},t.unit)]}
function runSheet(t){
  var tot=t.plan.reduce(function(a,p){return a+p[0]},0);
  return h('div',null,
    h('div',{class:'eyebrow',style:{marginTop:'18px'}},'Run sheet · '+tot+' minutes'),
    h('div',{class:'runsheet'},t.plan.map(function(p){return h('div',{class:'rs',style:{flexGrow:p[0]}},h('b',null,p[0]+' min'),h('span',null,p[1]))})));
}

function home(){
  var w=h('div');
  w.appendChild(h('div',{class:'eyebrow'},'The classroom lab'));
  w.appendChild(h('h1',{style:{marginTop:'12px'}},'Five tests for the model.'));
  w.appendChild(h('p',{class:'lead'},'The model says AI doesn\'t remove the work. It moves it. Do not take that on faith. Test it with your class. One test for each part of the model. Each fits one lesson of 30 to 40 minutes.'));
  w.appendChild(h('div',{class:'panel',style:{marginTop:'28px'}},h('h3',null,'How to run a test'),
    h('ol',{class:'steps'},[
      h('li',null,'Open the test. Read the claim and the prediction out loud. Ask the class if they agree. Write your own prediction first.'),
      h('li',null,'Show the assignment. Turn on Present for big text.'),
      h('li',null,'Students open the Do it tab on their own device. They finish and get a short code. The code has no name in it.'),
      h('li',null,'Switch to Teacher view. Paste the codes into Class results. The page works out the result and gives you one line for your class log.'),
      h('li',null,'Ask the class: What would break the claim? Record any case that does.')])));
  var g=h('div',{class:'grid3'});
  tests.forEach(function(t){
    g.appendChild(h('a',{class:'tcard',href:'#'+t.id},h('span',{class:'num'},String(t.n)),h('h3',null,t.title),h('p',{class:'pred',style:{margin:0}},h('b',null,'Claim. '),t.claim),h('div',{class:'meta'},metaPills(t))));
  });
  w.appendChild(g);
  w.appendChild(h('div',{class:'teachernote'},h('h4',null,'Teacher notes'),h('ul',null,
    h('li',null,'Run tests 1, 2 and 3 first. Then tests 4 and 5.'),
    h('li',null,'Each test page has a run sheet with minutes for each stage. Total time includes the intro and the debrief.'),
    h('li',null,'Small classes give small samples. Treat results as a case study. Look at the pattern and the exceptions.'),
    h('li',null,'Do not use student names in codes. Nothing is sent anywhere. Pasted codes stay in your browser on this device.'),
    h('li',null,'Teacher view shows the planted answers. Keep it off when students share the screen.'))));
  return w;
}

function testPage(t){
  var w=h('div');
  w.appendChild(h('div',{class:'eyebrow'},'Test '+t.n+' of 5 · '+t.unit));
  w.appendChild(h('h1',{style:{marginTop:'10px'}},t.title));
  w.appendChild(h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap',margin:'14px 0'}},metaPills(t)));
  w.appendChild(h('div',{class:'dark'},h('div',{class:'eyebrow',style:{color:'#9a9a96'}},'The claim we test'),h('div',{style:{fontFamily:'var(--sg)',fontWeight:700,fontSize:'clamp(22px,3vw,32px)',lineHeight:1.2,marginTop:'6px'}},t.claim)));
  w.appendChild(h('div',{class:'panel',style:{marginTop:'14px'}},h('div',{class:'eyebrow'},'Our prediction'),h('div',{style:{fontSize:'1.1em',marginTop:'4px'}},t.prediction)));
  w.appendChild(runSheet(t));
  var cur=tabs[t.id]||'assign';
  if(cur==='results'&&!mode.teacher)cur='assign';
  var tb=h('div',{class:'tabs',role:'tablist'});
  var body=h('div');
  function show(k){
    tabs[t.id]=k;
    Array.prototype.forEach.call(tb.children,function(b){b.setAttribute('aria-selected',b.getAttribute('data-k')===k)});
    body.innerHTML='';
    if(k==='assign'){
      body.appendChild(h('h2',null,'The assignment'));
      body.appendChild(h('ol',{class:'steps'},t.assign.map(function(s){return h('li',null,s)})));
      body.appendChild(h('div',{class:'teachernote'},h('h4',null,'Teacher notes'),h('ul',null,t.teacher.map(function(s){return h('li',null,s)}))));
    }else if(k==='do'){
      cache[t.id]=cache[t.id]||{};
      if(!cache[t.id].d)cache[t.id].d=t.build();
      body.appendChild(cache[t.id].d);
    }else{
      cache[t.id]=cache[t.id]||{};
      if(!cache[t.id].r)cache[t.id].r=t.results();
      body.appendChild(h('h2',null,'Class results'));
      body.appendChild(cache[t.id].r);
      cache[t.id].r.run();
    }
  }
  [['assign','1  The assignment'],['do','2  Do it']].concat(mode.teacher?[['results','3  Class results']]:[]).forEach(function(x){
    tb.appendChild(h('button',{class:'tab',role:'tab','data-k':x[0],'aria-selected':'false',type:'button',onclick:function(){show(x[0])}},x[1]));
  });
  w.appendChild(tb);w.appendChild(body);
  var idx=tests.indexOf(t);
  w.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',gap:'10px',marginTop:'40px',flexWrap:'wrap'}},
    h('a',{class:'btn',href:idx?'#'+tests[idx-1].id:'#home',style:{textDecoration:'none'}},idx?'Previous test':'Home'),
    idx<tests.length-1?h('a',{class:'btn solid',href:'#'+tests[idx+1].id,style:{textDecoration:'none'}},'Next test'):h('a',{class:'btn solid',href:'#home',style:{textDecoration:'none'}},'Back to all tests')));
  show(cur);
  return w;
}

function render(){
  var id=(location.hash||'#home').slice(1);
  var t=tests.filter(function(x){return x.id===id})[0];
  navLinks(t?t.id:'home');
  app.innerHTML='';
  app.appendChild(t?testPage(t):home());
  if(!window.__first)window.__first=1;else window.scrollTo(0,0);
  document.title=(t?'Test '+t.n+': '+t.title+' · ':'')+'AI Moves Work Lab';
}
window.addEventListener('hashchange',render);
applyMode();
render();
})();
</script>
